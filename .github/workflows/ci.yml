name: CI

on:
  push:
    branches:
      - develop
      - main
  pull_request:
    branches:
      - develop
  # Lets the checks be started by hand from the Actions tab.
  workflow_dispatch:
  # Reused by publish.yml, so a release is only built once these checks pass.
  workflow_call:

permissions:
  contents: read

jobs:
  quality:
    name: Quality checks (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Keep in step with the classifiers in pyproject.toml.
        python-version: ["3.12", "3.13", "3.14"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package and test tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install \
            "pytest>=8,<10" \
            "pytest-asyncio>=0.24,<2" \
            "pytest-cov>=6,<7" \
            "mypy>=1.15,<2" \
            "coverage[toml]>=7.6,<8" \
            "ruff==0.15.22" \
            "build>=1,<2" \
            "twine>=7,<8"

      - name: Check formatting
        run: python -m ruff format --check .

      - name: Run Ruff
        run: python -m ruff check .

      - name: Run mypy
        run: python -m mypy

      - name: Compile sources
        run: python -m compileall -q src tests

      - name: Run tests
        run: python -m pytest --cov=victron_modbus --cov-report=term-missing --cov-report=xml

      - name: Build package
        run: python -m build

      - name: Check package metadata
        run: python -m twine check --strict dist/*
